# Local development services. The Next.js app and worker run on the host with `npm run dev` / `npm run worker`
# (or inside Docker with `docker compose --profile app up`). Production uses docker-compose.prod.yml.
name: repairdesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repairdesk_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: repairdesk
      TZ: Africa/Nairobi
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairdesk_owner -d repairdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage for local dev only. Production points the same S3 client at Cloudflare R2 or AWS S3.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio_dev minio_dev_password; do sleep 1; done;
      mc mb --ignore-existing local/repairdesk-private;
      mc anonymous set none local/repairdesk-private;
      exit 0;"

  # Optional: run the app and worker in containers too.
  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://repairdesk_app:app_dev_password@postgres:5432/repairdesk
      DATABASE_SERVICE_URL: postgres://repairdesk_service:service_dev_password@postgres:5432/repairdesk
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["node", "worker.mjs"]
    env_file: .env
    environment:
      DATABASE_SERVICE_URL: postgres://repairdesk_service:service_dev_password@postgres:5432/repairdesk
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
