# Local development services. The Next.js app and worker run on the host with `npm run dev` / `npm run worker`
# (or inside Docker with `docker compose --profile app up`). Production uses docker-compose.prod.yml.
name: repairdesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repairdesk_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: repairdesk
      TZ: Africa/Nairobi
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairdesk_owner -d repairdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage for local dev only (SeaweedFS, Apache-2.0). Production points the same S3 client at
  # Cloudflare R2 or AWS S3. The bucket is created by `npm run db:seed` (or lib/storage.ts ensureBucket()).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - "59000:8333"
    volumes:
      - s3data:/data
      - ./db/init/s3.json:/etc/seaweedfs/s3.json:ro

  # Optional: run the app and worker in containers too.
  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://repairdesk_app:app_dev_password@postgres:5432/repairdesk
      DATABASE_SERVICE_URL: postgres://repairdesk_service:service_dev_password@postgres:5432/repairdesk
      S3_ENDPOINT: http://s3:8333
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["npx", "tsx", "worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_SERVICE_URL: postgres://repairdesk_service:service_dev_password@postgres:5432/repairdesk
      S3_ENDPOINT: http://s3:8333
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
